#
# Builds and publishes cross-platform CLI binaries on a v* tag via goreleaser.
# The CLI links the RA-TLS client library and is built with the Privasys Go
# fork (-tags ratls) so client-side challenge-response attestation works.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Run JS actions on Node 24 (org standard).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GO_RATLS_VERSION: privasys-v0.3.0-go1.26.5
  GOTOOLCHAIN: local
  # The Go fork's bundled go.env ships an empty GOPROXY; set it explicitly.
  GOPROXY: "https://proxy.golang.org,direct"
  GOSUMDB: "sum.golang.org"

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cli
        uses: actions/checkout@v5
        with:
          path: cli
          fetch-depth: 0

      - name: Checkout ra-tls-clients (sibling for the go.mod replace)
        uses: actions/checkout@v5
        with:
          repository: Privasys/ra-tls-clients
          # Pinned: c53cfb1 (TLS channel binder in challenge mode) needs a
          # crypto/tls RATLSChannelBinder that no released Privasys/go fork
          # carries yet (v0.3.0 predates it). Unpin when the fork release with
          # the channel binder ships and GO_RATLS_VERSION is bumped to it.
          ref: 7a35024a976768bf6276b86ab860b4aa14a05c06
          path: ra-tls-clients

      - name: Checkout enclave-vaults-client (sibling for the go.mod replace)
        uses: actions/checkout@v5
        with:
          repository: Privasys/enclave-vaults-client
          path: enclave-vaults-client

      - name: Install Go RA-TLS fork
        run: |
          curl -sL "https://github.com/Privasys/go/releases/download/${GO_RATLS_VERSION}/go-ratls-${GO_RATLS_VERSION}-linux-amd64.tar.gz" \
            -o /tmp/go-ratls.tar.gz
          tar -C "${GITHUB_WORKSPACE}" -xzf /tmp/go-ratls.tar.gz
          mv "${GITHUB_WORKSPACE}/go-ratls" "${GITHUB_WORKSPACE}/go-fork"
          echo "${GITHUB_WORKSPACE}/go-fork/bin" >> "$GITHUB_PATH"
          echo "GOROOT=${GITHUB_WORKSPACE}/go-fork" >> "$GITHUB_ENV"
          "${GITHUB_WORKSPACE}/go-fork/bin/go" version

      - name: Test (-tags ratls)
        working-directory: cli
        run: go test -tags ratls ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
          workdir: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with contents:write on Privasys/homebrew-tap + Privasys/scoop-bucket.
          # Always defined (empty when the secret is unset) so the goreleaser
          # templates resolve; when empty the brew/scoop publishers self-disable.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
