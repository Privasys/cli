#
# Builds and publishes cross-platform CLI binaries on a v* tag via goreleaser.
# The CLI links the RA-TLS v2 client library and builds on upstream Go.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Run JS actions on Node 24 (org standard).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GOTOOLCHAIN: local
  # The Go fork's bundled go.env ships an empty GOPROXY; set it explicitly.
  GOPROXY: "https://proxy.golang.org,direct"
  GOSUMDB: "sum.golang.org"

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cli
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: cli
          fetch-depth: 0

      - name: Checkout ra-tls-clients (sibling for the go.mod replace)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: Privasys/ra-tls-clients
          # v0.12.0: platform allow-list + PlatformFromQuote (attest reports whether the
          # platform identity came from the quote).
          ref: v0.12.0
          path: ra-tls-clients

      - name: Checkout enclave-vaults-client (sibling for the go.mod replace)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: Privasys/enclave-vaults-client
          # Pinned: the CLI handles sign-ins, so a new client commit enters a
          # release only when this pin is moved on purpose. d3aab925 =
          # the Go client with CapabilityBindingV2Always (v0.63.x asks v2
          # approvals on vaults that read every step-up as v2).
          ref: d3aab925133c9a5d99391b03e92601943a4dff71
          path: enclave-vaults-client

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: cli/go.mod

      - name: Test
        working-directory: cli
        run: go test ./...

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          # Pinned like the actions: the release tool runs with the publishing
          # tokens. v2.20.3 built v0.61.1; move it on purpose.
          version: "v2.20.3"
          args: release --clean
          workdir: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with contents:write on Privasys/homebrew-tap + Privasys/scoop-bucket.
          # Always defined (empty when the secret is unset) so the goreleaser
          # templates resolve; when empty the brew/scoop publishers self-disable.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          # Classic PAT (public_repo) for the winget pull request from
          # Privasys/winget-pkgs to microsoft/winget-pkgs. Empty = winget skipped.
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
