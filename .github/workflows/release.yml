#
# Builds and publishes cross-platform CLI binaries on a v* tag via goreleaser.
# The CLI links the RA-TLS v2 client library and builds on upstream Go.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Run JS actions on Node 24 (org standard).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GOTOOLCHAIN: local
  # The Go fork's bundled go.env ships an empty GOPROXY; set it explicitly.
  GOPROXY: "https://proxy.golang.org,direct"
  GOSUMDB: "sum.golang.org"

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cli
        uses: actions/checkout@v5
        with:
          path: cli
          fetch-depth: 0

      - name: Checkout ra-tls-clients (sibling for the go.mod replace)
        uses: actions/checkout@v5
        with:
          repository: Privasys/ra-tls-clients
          # v0.9.0: RA-TLS v2 (evidence after the handshake, OID scheme v2).
          ref: v0.9.0
          path: ra-tls-clients

      - name: Checkout enclave-vaults-client (sibling for the go.mod replace)
        uses: actions/checkout@v5
        with:
          repository: Privasys/enclave-vaults-client
          path: enclave-vaults-client

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod

      - name: Test
        working-directory: cli
        run: go test ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
          workdir: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with contents:write on Privasys/homebrew-tap + Privasys/scoop-bucket.
          # Always defined (empty when the secret is unset) so the goreleaser
          # templates resolve; when empty the brew/scoop publishers self-disable.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
