#
# Release config for the Privasys CLI. `goreleaser release` builds signed
# (checksummed) cross-platform binaries and publishes a GitHub release on a
# `v*` tag. Windows binaries are unsigned for now (no Authenticode cert).
version: 2

project_name: privasys

builds:
  - id: privasys
    main: ./cmd/privasys
    binary: privasys
    env:
      - CGO_ENABLED=0
    # Built with the Privasys Go fork (set up in the Release workflow) so the
    # client-side RA-TLS challenge (0xFFBB) is available.
    tags:
      - ratls
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/Privasys/cli/internal/cmd.Version={{ .Version }}
      - -X github.com/Privasys/cli/internal/cmd.Commit={{ .ShortCommit }}
      - -X github.com/Privasys/cli/internal/cmd.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

# Native Linux packages. These need no external token, so they ship on every
# release. The archives above remain the canonical agent/CI install path.
nfpms:
  - id: privasys
    package_name: privasys
    vendor: Privasys
    homepage: https://privasys.org
    maintainer: Privasys <support@privasys.org>
    description: |-
      The command-line interface to the Privasys confidential-computing platform.
      Authenticate with the wallet, deploy and manage confidential apps, manage
      teams and billing, and verify enclave attestation. Agent-first (MCP).
    license: AGPL-3.0
    formats: [deb, rpm]
    bindir: /usr/bin

# Homebrew tap (macOS/Linux) and Scoop bucket (Windows). These publish by
# pushing to sibling repos, which the per-repo Actions GITHUB_TOKEN cannot do,
# so they use a dedicated PAT (TAP_GITHUB_TOKEN). When that secret is absent the
# steps disable themselves and the rest of the release still succeeds; add the
# secret and they publish automatically on the next tag.
brews:
  - name: privasys
    repository:
      owner: Privasys
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    skip_upload: '{{ if .Env.TAP_GITHUB_TOKEN }}false{{ else }}true{{ end }}'
    directory: Formula
    homepage: https://privasys.org
    description: Deploy and verify confidential apps from your terminal or your agent
    license: AGPL-3.0
    test: |
      system "#{bin}/privasys", "version"
    install: |
      bin.install "privasys"

scoops:
  - name: privasys
    repository:
      owner: Privasys
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    skip_upload: '{{ if .Env.TAP_GITHUB_TOKEN }}false{{ else }}true{{ end }}'
    homepage: https://privasys.org
    description: Deploy and verify confidential apps from your terminal or your agent
    license: AGPL-3.0

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: Privasys
    name: cli
  draft: false
  prerelease: auto

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
